<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Labyrinth Cam</title>
<meta name="description" content="Real-time reaction-diffusion line portrait from your webcam.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23fff'/><path d='M20 80V35a15 15 0 0 1 30 0v30a5 5 0 0 0 10 0V35a15 15 0 0 1 30 0' fill='none' stroke='%23111' stroke-width='7' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --panel: rgba(255, 255, 255, 0.92);
    --ink: #111;
    --muted: #6a6a6a;
    --line: #dcdcdc;
    --accent: #111;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  body { font-family: "JetBrains Mono", ui-monospace, monospace; color: var(--ink); font-size: 12px; }
  canvas#gl { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }

  #preview {
    position: fixed; left: 16px; bottom: 16px;
    width: 160px; border-radius: 8px;
    border: 1px solid var(--line);
    transform: scaleX(-1);
    display: none;
    background: #000;
  }
  #preview.show { display: block; }

  #panel {
    position: fixed; top: 16px; right: 16px;
    width: 268px; max-height: calc(100vh - 32px); overflow-y: auto;
    background: var(--panel);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
    transition: opacity .2s ease, transform .2s ease;
  }
  #panel.hidden { opacity: 0; pointer-events: none; transform: translateY(-6px); }
  #panel h1 { font-size: 13px; font-weight: 600; margin: 0 0 2px; letter-spacing: .02em; }
  #panel .sub { color: var(--muted); margin: 0 0 12px; line-height: 1.4; }

  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
  button, label.btn {
    font: inherit; color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 6px;
    cursor: pointer;
    text-align: center;
    display: inline-flex; align-items: center; justify-content: center;
  }
  button:hover, label.btn:hover { border-color: var(--ink); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); grid-column: 1 / -1; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  label.btn input { display: none; }

  .row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 8px; margin-bottom: 9px; }
  .row label { color: var(--muted); }
  .row output { font-variant-numeric: tabular-nums; }
  .row input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--ink); margin: 0; }
  select { font: inherit; border: 1px solid var(--line); border-radius: 6px; padding: 3px 4px; background: #fff; color: var(--ink); }
  .checks { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 4px 0 10px; }
  .checks label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .checks input { accent-color: var(--ink); margin: 0; }
  .hint { color: var(--muted); line-height: 1.5; margin: 6px 0 0; }
  kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; font: inherit; }
  #msg { color: #b3261e; margin: 0 0 10px; display: none; line-height: 1.4; }
  #msg.show { display: block; }
  #fps { position: fixed; left: 16px; top: 16px; color: var(--muted); background: var(--panel); padding: 3px 7px; border-radius: 6px; display: none; }
  #fps.show { display: block; }

  #toolbar {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    display: flex; gap: 6px; padding: 6px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    max-width: calc(100vw - 32px);
  }
  #toolbar button { white-space: nowrap; padding: 8px 12px; }
  #toolbar button.primary { grid-column: auto; }
  #toolbar button[hidden] { display: none; }

  @media (max-width: 520px) {
    #panel { left: 16px; right: 16px; width: auto; top: auto; bottom: 76px; max-height: 50vh; }
    #preview { width: 96px; top: 16px; bottom: auto; }
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<video id="preview" playsinline muted></video>
<div id="fps"></div>

<nav id="toolbar">
  <button class="primary" id="camBtn">Start camera</button>
  <button id="switchBtn" hidden>Switch camera</button>
  <button id="snapBtn">Save PNG</button>
  <button id="panelBtn" aria-controls="panel">Settings</button>
</nav>

<aside id="panel">
  <h1>LABYRINTH CAM</h1>
  <p class="sub">Reaction-diffusion line portrait. Dark tones pack the lines tight, light tones open them up.</p>
  <p id="msg" role="alert"></p>

  <div class="btns">
    <label class="btn">Open image<input type="file" id="fileInput" accept="image/*"></label>
    <button id="pauseBtn">Pause</button>
    <button id="resetBtn">Reset</button>
  </div>

  <div class="row">
    <label for="pattern">Pattern</label>
    <select id="pattern">
      <option value="0.029,0.057">Maze</option>
      <option value="0.0545,0.062">Coral</option>
      <option value="0.037,0.06">Fingerprint</option>
      <option value="0.042,0.061">Worms</option>
    </select>
  </div>
  <div class="row">
    <label for="render">Render</label>
    <select id="render">
      <option value="0">Lines</option>
      <option value="1">Fill</option>
    </select>
  </div>

  <div class="row"><label for="detail">Detail</label><output data-for="detail"></output>
    <input type="range" id="detail" min="0.35" max="1.5" step="0.05" value="1"></div>
  <div class="row"><label for="rhoMax">Fine (dark) density</label><output data-for="rhoMax"></output>
    <input type="range" id="rhoMax" min="0.4" max="2.5" step="0.05" value="1.8"></div>
  <div class="row"><label for="rhoMin">Coarse (light) density</label><output data-for="rhoMin"></output>
    <input type="range" id="rhoMin" min="0.02" max="0.6" step="0.01" value="0.06"></div>
  <div class="row"><label for="contrast">Contrast</label><output data-for="contrast"></output>
    <input type="range" id="contrast" min="0.5" max="3" step="0.05" value="1.6"></div>
  <div class="row"><label for="bright">Brightness</label><output data-for="bright"></output>
    <input type="range" id="bright" min="-0.5" max="0.5" step="0.01" value="0.05"></div>
  <div class="row"><label for="lineW">Line width (px)</label><output data-for="lineW"></output>
    <input type="range" id="lineW" min="0.5" max="4" step="0.1" value="1.3"></div>
  <div class="row"><label for="iters">Speed (steps/frame)</label><output data-for="iters"></output>
    <input type="range" id="iters" min="1" max="48" step="1" value="20"></div>

  <div class="checks">
    <label><input type="checkbox" id="mirror" checked> Mirror</label>
    <label><input type="checkbox" id="invert"> Invert</label>
    <label><input type="checkbox" id="autoLevels" checked> Auto levels</label>
    <label><input type="checkbox" id="showCam"> Camera</label>
    <label><input type="checkbox" id="showFps"> FPS</label>
  </div>

  <p class="hint"><kbd>H</kbd> hide panel · <kbd>Space</kbd> pause · <kbd>R</kbd> reset · <kbd>S</kbd> save</p>
</aside>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from "three";

const $ = (id) => document.getElementById(id);
const canvas = $("gl");
const video = $("preview");
const msg = $("msg");

const showMsg = (t) => { msg.textContent = t || ""; msg.classList.toggle("show", !!t); };
// Surface runtime errors in the panel instead of failing silently (e.g. on mobile).
const showError = (text) => { showMsg("Error: " + text); $("panel").classList.remove("hidden"); };
window.addEventListener("error", (e) => showError(e.message));
window.addEventListener("unhandledrejection", (e) => showError(e.reason?.message || String(e.reason)));

// Phones: finer stripes (the face is small on screen) and keep the panel out of the way.
if (matchMedia("(max-width: 520px)").matches) {
  $("detail").value = "1.8";
  $("rhoMax").value = "2.2";
  $("panel").classList.add("hidden");
}

// ---------------------------------------------------------------- renderer
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, powerPreference: "high-performance" });
} catch (e) {
  showMsg("WebGL2 is not available in this browser.");
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.autoClear = false;

const gl = renderer.getContext();
// Full float keeps Gray-Scott stable; fall back to half float where float targets are missing.
const simType = gl.getExtension("EXT_color_buffer_float") ? THREE.FloatType : THREE.HalfFloatType;

const scene = new THREE.Scene();
const camera = new THREE.Camera();
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
quad.frustumCulled = false;
scene.add(quad);

const vert = /* glsl */`
  varying vec2 vUv;
  void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
`;

// ---------------------------------------------------------------- simulation
// Gray-Scott reaction-diffusion (Karl Sims units: Da = 1, Db = 0.5, dt = 1).
// The source luminance scales the reaction rate `rho`. Scaling the reaction by
// rho is equivalent to scaling space by 1/sqrt(rho), so dark pixels (high rho)
// grow fine stripes and light pixels (low rho) grow wide ones — while the
// diffusion step, which bounds stability, stays untouched.
const simFrag = /* glsl */`
  precision highp float;
  uniform sampler2D uState;
  uniform sampler2D uSource;
  uniform vec2 uRes;
  uniform float uSourceAspect;
  uniform float uMirror;
  uniform float uFeed, uKill;
  uniform float uRhoMin, uRhoMax;
  uniform float uContrast, uBright;
  uniform float uLo, uHi;     // auto-levels black / white points
  uniform float uFit;         // 0 = cover (camera), 1 = contain (images)
  uniform float uReset;
  uniform float uSeed;
  varying vec2 vUv;

  float hash(vec2 p) {
    p = fract(p * vec2(123.34, 456.21) + uSeed);
    p += dot(p, p + 45.32);
    return fract(p.x * p.y);
  }

  // Cover- or contain-fit the source into the sim rectangle.
  vec2 sourceUv(vec2 uv) {
    float ca = uRes.x / uRes.y;
    float r = ca / uSourceAspect;
    if (uFit > 0.5) {
      if (r > 1.0) uv.x = 0.5 + (uv.x - 0.5) * r;        // pillarbox
      else         uv.y = 0.5 + (uv.y - 0.5) / r;        // letterbox
    } else {
      if (r > 1.0) uv.y = 0.5 + (uv.y - 0.5) / r;        // crop top/bottom
      else         uv.x = 0.5 + (uv.x - 0.5) * r;        // crop sides
    }
    if (uMirror > 0.5) uv.x = 1.0 - uv.x;
    return uv;
  }

  float luma(vec2 uv) {
    return dot(texture2D(uSource, uv).rgb, vec3(0.299, 0.587, 0.114));
  }

  void main() {
    ivec2 p = ivec2(gl_FragCoord.xy);

    if (uReset > 0.5) {
      // Dense blocky noise so the labyrinth forms everywhere at once.
      float n = hash(floor(gl_FragCoord.xy / 4.0));
      float v = n > 0.55 ? 0.25 : 0.0;
      gl_FragColor = vec4(1.0 - v, v, 0.0, 1.0);
      return;
    }

    ivec2 mx = ivec2(uRes) - 1;
    #define S(dx, dy) texelFetch(uState, clamp(p + ivec2(dx, dy), ivec2(0), mx), 0).rg
    vec2 c = S(0, 0);
    vec2 lap = -c
      + 0.2  * (S(1, 0) + S(-1, 0) + S(0, 1) + S(0, -1))
      + 0.05 * (S(1, 1) + S(-1, 1) + S(1, -1) + S(-1, -1));

    // Lightly blurred source tone; outside a contained image is blank paper.
    vec2 suv = sourceUv(vUv);
    float L;
    if (any(lessThan(suv, vec2(0.0))) || any(greaterThan(suv, vec2(1.0)))) {
      L = 1.0;
    } else {
      vec2 o = 2.0 / uRes;
      L = 0.4 * luma(suv)
        + 0.15 * (luma(suv + vec2(o.x, 0.0)) + luma(suv - vec2(o.x, 0.0))
                + luma(suv + vec2(0.0, o.y)) + luma(suv - vec2(0.0, o.y)));
      L = clamp((L - uLo) / max(uHi - uLo, 0.05), 0.0, 1.0);
      L = clamp((L - 0.5) * uContrast + 0.5 + uBright, 0.0, 1.0);
    }
    float rho = mix(uRhoMax, uRhoMin, L);

    float u = c.x, v = c.y;
    float uvv = u * v * v;
    float du = 1.0 * lap.x + rho * (-uvv + uFeed * (1.0 - u));
    float dv = 0.5 * lap.y + rho * ( uvv - (uFeed + uKill) * v);
    gl_FragColor = vec4(clamp(c + vec2(du, dv), 0.0, 1.0), 0.0, 1.0);
  }
`;

// ---------------------------------------------------------------- display
// Draw the isoline v = threshold at a constant on-screen width:
// distance(px) ≈ |v - T| / |∇v| · (screen px per sim texel).
const displayFrag = /* glsl */`
  precision highp float;
  uniform sampler2D uState;
  uniform vec2 uRes;
  uniform float uPxPerTexel;
  uniform float uLineW;
  uniform float uThresh;
  uniform float uMode;
  uniform float uInvert;
  varying vec2 vUv;

  float V(vec2 t) {
    vec2 q = t - 0.5;
    ivec2 i = ivec2(floor(q));
    vec2 f = fract(q);
    ivec2 mx = ivec2(uRes) - 1;
    float a = texelFetch(uState, clamp(i,               ivec2(0), mx), 0).g;
    float b = texelFetch(uState, clamp(i + ivec2(1, 0), ivec2(0), mx), 0).g;
    float c = texelFetch(uState, clamp(i + ivec2(0, 1), ivec2(0), mx), 0).g;
    float d = texelFetch(uState, clamp(i + ivec2(1, 1), ivec2(0), mx), 0).g;
    return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
  }

  void main() {
    vec2 t = vUv * uRes;
    float v = V(t);
    vec2 g = 0.5 * vec2(V(t + vec2(1.0, 0.0)) - V(t - vec2(1.0, 0.0)),
                        V(t + vec2(0.0, 1.0)) - V(t - vec2(0.0, 1.0)));
    float sd = (v - uThresh) / max(length(g), 1e-5) * uPxPerTexel; // signed px distance
    float ink;
    if (uMode < 0.5) {
      float hw = 0.5 * uLineW;
      ink = 1.0 - smoothstep(hw - 0.6, hw + 0.6, abs(sd));
    } else {
      ink = smoothstep(-0.7, 0.7, sd);
    }
    if (uInvert > 0.5) ink = 1.0 - ink;
    gl_FragColor = vec4(vec3(1.0 - ink), 1.0);
  }
`;

const fallbackSource = makeFallbackSource();
let source = fallbackSource;

const simMat = new THREE.ShaderMaterial({
  vertexShader: vert,
  fragmentShader: simFrag,
  uniforms: {
    uState: { value: null },
    uSource: { value: source.texture },
    uRes: { value: new THREE.Vector2(1, 1) },
    uSourceAspect: { value: source.aspect },
    uMirror: { value: 0 },
    uFit: { value: 0 },
    uLo: { value: 0 },
    uHi: { value: 1 },
    uFeed: { value: 0.029 },
    uKill: { value: 0.057 },
    uRhoMin: { value: 0.06 },
    uRhoMax: { value: 1.8 },
    uContrast: { value: 1.6 },
    uBright: { value: 0.05 },
    uReset: { value: 1 },
    uSeed: { value: Math.random() },
  },
  depthTest: false,
  depthWrite: false,
});

const displayMat = new THREE.ShaderMaterial({
  vertexShader: vert,
  fragmentShader: displayFrag,
  uniforms: {
    uState: { value: null },
    uRes: { value: new THREE.Vector2(1, 1) },
    uPxPerTexel: { value: 1 },
    uLineW: { value: 1.3 },
    uThresh: { value: 0.15 },
    uMode: { value: 0 },
    uInvert: { value: 0 },
  },
  depthTest: false,
  depthWrite: false,
});

// ---------------------------------------------------------------- targets
let targets = [];
let cur = 0;
let simW = 1, simH = 1;

const makeTarget = (w, h) => new THREE.WebGLRenderTarget(w, h, {
  type: simType,
  format: THREE.RGBAFormat,
  minFilter: THREE.NearestFilter,
  magFilter: THREE.NearestFilter,
  wrapS: THREE.ClampToEdgeWrapping,
  wrapT: THREE.ClampToEdgeWrapping,
  depthBuffer: false,
  stencilBuffer: false,
});

let rebuildTimer = 0;
const settings = {
  detail: parseFloat($("detail").value),
  iters: 20,
  paused: false,
};

function rebuild() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  let sw = Math.round(w * settings.detail);
  let sh = Math.round(h * settings.detail);
  const maxPx = 1600 * 1000;
  if (sw * sh > maxPx) {
    const k = Math.sqrt(maxPx / (sw * sh));
    sw = Math.round(sw * k); sh = Math.round(sh * k);
  }
  simW = Math.max(16, sw); simH = Math.max(16, sh);
  targets.forEach((t) => t.dispose());
  targets = [makeTarget(simW, simH), makeTarget(simW, simH)];
  cur = 0;
  simMat.uniforms.uRes.value.set(simW, simH);
  displayMat.uniforms.uRes.value.set(simW, simH);
  displayMat.uniforms.uPxPerTexel.value = renderer.domElement.width / simW;
  reset();
}

function reset() {
  simMat.uniforms.uSeed.value = Math.random();
  simMat.uniforms.uReset.value = 1;
  step(1);
  simMat.uniforms.uReset.value = 0;
}

function step(n) {
  quad.material = simMat;
  for (let i = 0; i < n; i++) {
    simMat.uniforms.uState.value = targets[cur].texture;
    renderer.setRenderTarget(targets[1 - cur]);
    renderer.render(scene, camera);
    cur = 1 - cur;
  }
  renderer.setRenderTarget(null);
}

function display() {
  quad.material = displayMat;
  displayMat.uniforms.uState.value = targets[cur].texture;
  renderer.setRenderTarget(null);
  renderer.render(scene, camera);
}

// ---------------------------------------------------------------- sources
function makeFallbackSource() {
  // A soft, portrait-ish tone study shown until the camera or an image is used.
  const c = document.createElement("canvas");
  c.width = 640; c.height = 480;
  const g = c.getContext("2d");
  g.fillStyle = "#f4f4f4"; g.fillRect(0, 0, c.width, c.height);
  const blob = (x, y, rx, ry, a0, a1) => {
    const gr = g.createRadialGradient(x, y, 0, x, y, Math.max(rx, ry));
    gr.addColorStop(0, `rgba(0,0,0,${a0})`);
    gr.addColorStop(1, `rgba(0,0,0,${a1})`);
    g.save(); g.translate(x, y); g.scale(rx / Math.max(rx, ry), ry / Math.max(rx, ry)); g.translate(-x, -y);
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, Math.max(rx, ry), 0, Math.PI * 2); g.fill(); g.restore();
  };
  blob(320, 250, 170, 210, 0.55, 0.0);   // head
  blob(300, 120, 190, 110, 0.8, 0.0);    // hair
  blob(260, 240, 40, 22, 0.8, 0.0);      // eye
  blob(380, 240, 40, 22, 0.8, 0.0);      // eye
  blob(320, 360, 55, 20, 0.6, 0.0);      // mouth
  blob(320, 470, 260, 90, 0.5, 0.0);     // shoulders
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.NoColorSpace;
  return { texture: tex, aspect: c.width / c.height, kind: "fallback", el: c };
}

function setSource(s) {
  if (source && source !== s && source.kind === "image") source.texture.dispose();
  source = s;
  simMat.uniforms.uSource.value = s.texture;
  simMat.uniforms.uSourceAspect.value = s.aspect;
  simMat.uniforms.uMirror.value = s.kind === "camera" && $("mirror").checked ? 1 : 0;
  simMat.uniforms.uFit.value = s.kind === "image" ? 1 : 0;
  measureLevels(true);
}

// ---------------------------------------------------------------- auto levels
// Stretch the source's 2nd–98th luminance percentiles to full range, so flat,
// mid-grey photos still produce a wide spread of stripe densities.
const levelCanvas = document.createElement("canvas");
levelCanvas.width = levelCanvas.height = 64;
const levelCtx = levelCanvas.getContext("2d", { willReadFrequently: true });
let autoLevels = true;

function measureLevels(snap) {
  const u = simMat.uniforms;
  if (!autoLevels || !source?.el) { u.uLo.value = 0; u.uHi.value = 1; return; }
  const el = source.el;
  if (el.videoWidth === 0) return;
  try { levelCtx.drawImage(el, 0, 0, 64, 64); } catch (_) { return; }
  const d = levelCtx.getImageData(0, 0, 64, 64).data;
  const hist = new Uint32Array(256);
  for (let i = 0; i < d.length; i += 4) hist[Math.round(0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2])]++;
  const total = 64 * 64;
  const pct = (q) => { let acc = 0; for (let i = 0; i < 256; i++) { acc += hist[i]; if (acc >= q * total) return i / 255; } return 1; };
  const lo = pct(0.02), hi = Math.max(pct(0.98), lo + 0.05);
  const k = snap ? 1 : 0.3; // ease for live video so density doesn't flicker
  u.uLo.value += (lo - u.uLo.value) * k;
  u.uHi.value += (hi - u.uHi.value) * k;
}
setInterval(() => { if (source?.kind === "camera") measureLevels(false); }, 250);

let camStream = null;
let camFacing = "user";
let camTexture = null;

video.addEventListener("resize", () => {
  if (video.videoWidth && source.kind === "camera") simMat.uniforms.uSourceAspect.value = video.videoWidth / video.videoHeight;
});

const setMirror = (on) => {
  $("mirror").checked = on;
  simMat.uniforms.uMirror.value = source.kind === "camera" && on ? 1 : 0;
  video.style.transform = on ? "scaleX(-1)" : "none";
};

async function openStream(videoConstraints) {
  return navigator.mediaDevices.getUserMedia({
    video: { width: { ideal: 1280 }, height: { ideal: 720 }, ...videoConstraints },
    audio: false,
  });
}

async function startCamera(videoConstraints = { facingMode: camFacing }) {
  showMsg("");
  if (!navigator.mediaDevices?.getUserMedia) {
    showMsg("Camera is not available. Open this page over HTTPS in a recent browser.");
    return false;
  }
  let stream;
  try {
    // Release the current camera first: phones often allow only one open at a time.
    camStream?.getTracks().forEach((t) => t.stop());
    stream = await openStream(videoConstraints);
  } catch (e) {
    if (camStream) { try { stream = await openStream({ facingMode: camFacing }); } catch (_) {} }
    if (!stream) {
      showMsg("Camera access was blocked. Allow camera access for this site and try again.");
      camStream = null;
      return false;
    }
  }
  camStream = stream;
  video.srcObject = stream;
  await video.play();
  if (!camTexture) {
    camTexture = new THREE.VideoTexture(video);
    camTexture.colorSpace = THREE.NoColorSpace;
    camTexture.minFilter = THREE.LinearFilter;
    camTexture.magFilter = THREE.LinearFilter;
  }
  const settingsNow = stream.getVideoTracks()[0]?.getSettings?.() || {};
  if (settingsNow.facingMode) camFacing = settingsNow.facingMode;
  setSource({ texture: camTexture, aspect: (video.videoWidth || 16) / (video.videoHeight || 9), kind: "camera", el: video });
  // Selfie cameras read naturally mirrored; rear cameras do not.
  setMirror(camFacing !== "environment");
  $("camBtn").textContent = "Stop camera";

  const cams = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "videoinput");
  $("switchBtn").hidden = cams.length < 2;
  return true;
}

// Phones: flip front/back via facingMode. Desktops (no facing info): cycle devices.
async function switchCamera() {
  if (!camStream) return;
  const cur = camStream.getVideoTracks()[0]?.getSettings?.() || {};
  const cams = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "videoinput");
  if (cur.facingMode) {
    const next = cur.facingMode === "environment" ? "user" : "environment";
    camFacing = next;
    if (await startCamera({ facingMode: { exact: next } })) {
      const now = camStream.getVideoTracks()[0]?.getSettings?.() || {};
      if (now.deviceId !== cur.deviceId) return;
    }
  }
  if (cams.length < 2) return;
  const i = cams.findIndex((d) => d.deviceId === cur.deviceId);
  const nextCam = cams[(i + 1) % cams.length];
  camFacing = "user";
  await startCamera({ deviceId: { exact: nextCam.deviceId } });
}

function stopCamera() {
  camStream?.getTracks().forEach((t) => t.stop());
  camStream = null;
  video.srcObject = null;
  $("switchBtn").hidden = true;
  if (source.kind === "camera") setSource(fallbackSource);
  $("camBtn").textContent = "Start camera";
}

function loadImage(file) {
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    const tex = new THREE.Texture(img);
    tex.colorSpace = THREE.NoColorSpace;
    tex.minFilter = THREE.LinearFilter;
    tex.generateMipmaps = false;
    tex.needsUpdate = true;
    if (camStream) stopCamera();
    setSource({ texture: tex, aspect: img.naturalWidth / img.naturalHeight, kind: "image", el: img });
    reset();
    URL.revokeObjectURL(url);
  };
  img.onerror = () => { showMsg("Could not open this image."); URL.revokeObjectURL(url); };
  img.src = url;
}

// ---------------------------------------------------------------- UI
const bindRange = (id, fmt, apply) => {
  const el = $(id);
  const out = document.querySelector(`output[data-for="${id}"]`);
  const update = () => { const v = parseFloat(el.value); out.textContent = fmt(v); apply(v); };
  el.addEventListener("input", update);
  update();
};
const f2 = (v) => v.toFixed(2);

bindRange("detail", f2, (v) => { if (settings.detail !== v) { settings.detail = v; scheduleRebuild(); } });
bindRange("rhoMax", f2, (v) => { simMat.uniforms.uRhoMax.value = v; });
bindRange("rhoMin", f2, (v) => { simMat.uniforms.uRhoMin.value = v; });
bindRange("contrast", f2, (v) => { simMat.uniforms.uContrast.value = v; });
bindRange("bright", f2, (v) => { simMat.uniforms.uBright.value = v; });
bindRange("lineW", (v) => v.toFixed(1), (v) => { displayMat.uniforms.uLineW.value = v * renderer.getPixelRatio(); });
bindRange("iters", (v) => String(v), (v) => { settings.iters = v; });

$("pattern").addEventListener("change", (e) => {
  const [f, k] = e.target.value.split(",").map(Number);
  simMat.uniforms.uFeed.value = f;
  simMat.uniforms.uKill.value = k;
});
$("render").addEventListener("change", (e) => { displayMat.uniforms.uMode.value = Number(e.target.value); });
$("invert").addEventListener("change", (e) => { displayMat.uniforms.uInvert.value = e.target.checked ? 1 : 0; });
$("mirror").addEventListener("change", (e) => {
  simMat.uniforms.uMirror.value = source.kind === "camera" && e.target.checked ? 1 : 0;
  video.style.transform = e.target.checked ? "scaleX(-1)" : "none";
});
$("autoLevels").addEventListener("change", (e) => { autoLevels = e.target.checked; measureLevels(true); });
$("showCam").addEventListener("change", (e) => video.classList.toggle("show", e.target.checked));
$("showFps").addEventListener("change", (e) => $("fps").classList.toggle("show", e.target.checked));

$("camBtn").addEventListener("click", () => (camStream ? stopCamera() : startCamera()));
$("switchBtn").addEventListener("click", switchCamera);
$("panelBtn").addEventListener("click", () => $("panel").classList.toggle("hidden"));
$("fileInput").addEventListener("change", (e) => { const f = e.target.files?.[0]; if (f) loadImage(f); e.target.value = ""; });
$("resetBtn").addEventListener("click", reset);
const togglePause = () => {
  settings.paused = !settings.paused;
  $("pauseBtn").textContent = settings.paused ? "Resume" : "Pause";
};
$("pauseBtn").addEventListener("click", togglePause);

let snapRequested = false;
$("snapBtn").addEventListener("click", () => { snapRequested = true; });

document.addEventListener("keydown", (e) => {
  if (e.target.closest("input, select") || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "h") $("panel").classList.toggle("hidden");
  else if (k === " " && !e.target.closest("button")) { e.preventDefault(); togglePause(); }
  else if (k === "r") reset();
  else if (k === "s") snapRequested = true;
});

function scheduleRebuild() {
  clearTimeout(rebuildTimer);
  rebuildTimer = setTimeout(rebuild, 120);
}
window.addEventListener("resize", scheduleRebuild);

// ---------------------------------------------------------------- loop
let frames = 0, fpsT = performance.now();
function frame() {
  if (!settings.paused) step(settings.iters);
  display();

  if (snapRequested) {
    snapRequested = false;
    // Read back in the same task as the draw, so the buffer is still intact.
    canvas.toBlob((b) => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(b);
      a.download = `labyrinth-${Date.now()}.png`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }, "image/png");
  }

  frames++;
  const now = performance.now();
  if (now - fpsT > 500) {
    $("fps").textContent = `${Math.round((frames * 1000) / (now - fpsT))} fps · ${simW}×${simH}`;
    frames = 0; fpsT = now;
  }
  requestAnimationFrame(frame);
}

rebuild();
requestAnimationFrame(frame);
</script>
</body>
</html>
